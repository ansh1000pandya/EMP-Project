{% extends "base.html" %}
{% block title %}{{ 'Edit' if course else 'Add' }} Course{% endblock %}
{% block content %}
<h2>{{ 'Edit' if course else 'Add' }} Course</h2>
<form method="POST">
  <div class="mb-3">
    <label class="form-label">Code *</label>
    <input type="text" name="code" class="form-control" value="{{ course.code if course else '' }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Name *</label>
    <input type="text" name="name" class="form-control" value="{{ course.name if course else '' }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Description</label>
    <textarea name="description" class="form-control" rows="3">{{ course.description if course else '' }}</textarea>
  </div>
  <button type="submit" class="btn btn-primary">Save</button>
  <a href="{{ url_for('admin.courses') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
