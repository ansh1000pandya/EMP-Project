{% extends "base.html" %}
{% block title %}{{ 'Edit' if rubric else 'Add' }} Rubric{% endblock %}
{% block content %}
<h2>{{ 'Edit' if rubric else 'Add' }} Rubric for {{ exam.title }}</h2>
<form method="POST">
  <div class="mb-3">
    <label class="form-label">Criterion *</label>
    <input type="text" name="criterion" class="form-control" value="{{ rubric.criterion if rubric else '' }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Max Marks *</label>
    <input type="number" step="0.5" name="max_marks" class="form-control" value="{{ rubric.max_marks if rubric else '' }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Description</label>
    <textarea name="description" class="form-control" rows="2">{{ rubric.description if rubric else '' }}</textarea>
  </div>
  <button type="submit" class="btn btn-primary">Save</button>
  <a href="{{ url_for('admin.rubrics', exam_id=exam.id) }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
