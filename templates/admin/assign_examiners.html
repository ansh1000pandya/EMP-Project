{% extends "base.html" %}
{% block title %}Assign Examiners – {{ exam.title }}{% endblock %}
{% block content %}
<h2>Assign Examiners to: {{ exam.title }}</h2>
<p class="text-muted">Only Approved examiners are shown.</p>

<form method="POST">
  {% for e in approved %}
  <div class="form-check">
    <input class="form-check-input" type="checkbox" name="examiner_ids" value="{{ e.id }}"
           id="ex{{ e.id }}" {% if e.id in assigned_ids %}checked{% endif %}>
    <label class="form-check-label" for="ex{{ e.id }}">
      {{ e.full_name }} ({{ e.username }})
    </label>
  </div>
  {% else %}
  <p class="text-warning">No approved examiners available.</p>
  {% endfor %}

  <button type="submit" class="btn btn-primary mt-3">Save Assignments</button>
  <a href="{{ url_for('admin.exams') }}" class="btn btn-secondary mt-3">Cancel</a>
</form>
{% endblock %}
