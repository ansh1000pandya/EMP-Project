{% extends "base.html" %}
{% block title %}{{ 'Edit' if exam else 'Add' }} Exam{% endblock %}
{% block content %}
<h2>{{ 'Edit' if exam else 'Add' }} Exam</h2>
<form method="POST">
  <div class="mb-3">
    <label class="form-label">Course *</label>
    <select name="course_id" class="form-select" required>
      <option value="">-- Select Course --</option>
      {% for c in courses %}
        <option value="{{ c.id }}" {% if exam and exam.course_id == c.id %}selected{% endif %}>
          {{ c.code }} – {{ c.name }}
        </option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">Title *</label>
    <input type="text" name="title" class="form-control" value="{{ exam.title if exam else '' }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Type *</label>
    <select name="exam_type" class="form-select" required>
      {% for t in ['Viva', 'Practical', 'Project Demo', 'Assessment'] %}
        <option value="{{ t }}" {% if exam and exam.exam_type == t %}selected{% endif %}>{{ t }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">Status</label>
    <select name="status" class="form-select">
      {% for s in ['Draft', 'Slot Creation', 'Booking Open', 'Closed', 'Completed'] %}
        <option value="{{ s }}" {% if exam and exam.status == s %}selected{% endif %}>{{ s }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">Description</label>
    <textarea name="description" class="form-control" rows="2">{{ exam.description if exam else '' }}</textarea>
  </div>

  <h5 class="mt-4">Time Windows (leave blank if not set yet)</h5>
  <div class="row">
    <div class="col-md-6 mb-3">
      <label class="form-label">Slot Creation Start</label>
      <input type="datetime-local" name="slot_creation_start" class="form-control"
             value="{{ exam.slot_creation_start.strftime('%Y-%m-%dT%H:%M') if exam and exam.slot_creation_start else '' }}">
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">Slot Creation End</label>
      <input type="datetime-local" name="slot_creation_end" class="form-control"
             value="{{ exam.slot_creation_end.strftime('%Y-%m-%dT%H:%M') if exam and exam.slot_creation_end else '' }}">
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">Booking Start</label>
      <input type="datetime-local" name="booking_start" class="form-control"
             value="{{ exam.booking_start.strftime('%Y-%m-%dT%H:%M') if exam and exam.booking_start else '' }}">
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">Booking End</label>
      <input type="datetime-local" name="booking_end" class="form-control"
             value="{{ exam.booking_end.strftime('%Y-%m-%dT%H:%M') if exam and exam.booking_end else '' }}">
    </div>
  </div>

  <button type="submit" class="btn btn-primary">Save</button>
  <a href="{{ url_for('admin.exams') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
